name: CI
on:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    strategy:
      matrix:
        node:
        - 18
        - 20
        - 22
      fail-fast: false
    steps:
    - name: Checkout tflo-browser-events
      uses: actions/checkout@v4
      with:
        path: tflo-browser-events
    - name: Checkout companion tflo monorepo
      uses: actions/checkout@v4
      with:
        repository: matt-cochran/tflo
        path: tflo
        fetch-depth: 1
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Install wasm-pack
      run: 'curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

        '
    - name: "Build WASM (web target) \u2014 into src/wasm/"
      working-directory: tflo/tflo-cep-wasm
      run: "mkdir -p $GITHUB_WORKSPACE/tflo-browser-events/src/wasm\nwasm-pack build \\\n  --target web \\\n  --release\
        \ \\\n  --out-dir $GITHUB_WORKSPACE/tflo-browser-events/src/wasm \\\n  --out-name tflo_cep_wasm\n"
      env:
        RUSTC_WRAPPER: ''
    - name: "Build WASM (nodejs target) \u2014 tests depend on this"
      working-directory: tflo/tflo-cep-wasm
      run: "wasm-pack build \\\n  --target nodejs \\\n  --release \\\n  --out-dir pkg-node \\\n  --out-name tflo_cep_wasm\n"
      env:
        RUSTC_WRAPPER: ''
    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: npm
        cache-dependency-path: tflo-browser-events/package-lock.json
    - name: Install dependencies
      working-directory: tflo-browser-events
      run: npm ci
    - name: Lint (TypeScript type-check)
      working-directory: tflo-browser-events
      run: npm run lint
    - name: Run tests
      working-directory: tflo-browser-events
      run: npm test
    - name: Build (TS compilation)
      working-directory: tflo-browser-events
      run: npm run build:ts
