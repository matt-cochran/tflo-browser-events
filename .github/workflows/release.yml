name: Release

# Tokenless publish to npm via OIDC trusted publishing.
# Configure the trusted publisher once at:
#   npmjs.com → package tflo-browser-events → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: matt-cochran
#     Repository:           tflo-browser-events
#     Workflow filename:    release.yml
# After that, cut a release with:  git tag v0.1.1 && git push origin v0.1.1
# No NPM_TOKEN, no OTP — GitHub proves its identity to npm and provenance is signed automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing (and provenance attestation)

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, newer than the runner default.
      - run: npm install -g npm@latest

      # The compiled dist/ (including dist/wasm/) is committed and IS the published
      # artifact — the wasm source crate (tflo-cep-wasm) lives in the separate `tflo`
      # monorepo and is intentionally not built here. Rebuild + commit dist/ before
      # tagging a release. `npm publish` ships the committed dist as-is (there is no
      # prepublishOnly hook), authenticating via OIDC — no NODE_AUTH_TOKEN needed.
      - run: npm publish --access public
